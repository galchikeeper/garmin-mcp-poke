services:
  - type: web
    name: garmin-mcp-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python src/server.py
    autoDeploy: false
    envVars:
      - key: GARMIN_TOKENS_BASE64
        sync: false
      - key: GIST_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
